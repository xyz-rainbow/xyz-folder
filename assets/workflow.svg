<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-label="xyz-folder workflow">
  <defs>
    <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#c8ff00"/>
      <stop offset="100%" stop-color="#ff2bd6"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="420" fill="#0a0614"/>
  
  <text x="40" y="44" fill="#ff2bd6" font-family="Segoe UI, -apple-system, sans-serif" font-size="24" font-weight="700">Execution Lifecycle: From Chaos to Verified Order</text>
  <text x="40" y="72" fill="#8ad4e8" font-family="Segoe UI, -apple-system, sans-serif" font-size="14">A respectful, interactive protocol that asks, previews, journals, and protects every file</text>

  <!-- Step 1 -->
  <g transform="translate(40, 100)" font-family="Segoe UI, -apple-system, sans-serif">
    <rect width="180" height="240" rx="10" fill="#141022" stroke="#00f0ff" stroke-width="1.5"/>
    <circle cx="90" cy="40" r="20" fill="#00f0ff" fill-opacity="0.2"/>
    <text x="82" y="47" fill="#00f0ff" font-size="18" font-weight="700">1</text>
    <text x="90" y="85" fill="#e8f7ff" font-size="15" font-weight="700" text-anchor="middle">Scan &amp; Detect</text>
    <text x="90" y="115" fill="#8ad4e8" font-size="12" text-anchor="middle">• Discover path</text>
    <text x="90" y="135" fill="#8ad4e8" font-size="12" text-anchor="middle">• Detect language</text>
    <text x="90" y="155" fill="#8ad4e8" font-size="12" text-anchor="middle">• Read signatures</text>
    <text x="90" y="195" fill="#a0aec0" font-size="11" text-anchor="middle">No files moved</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 228 220 L 252 220" stroke="#00f0ff" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="252,216 260,220 252,224" fill="#00f0ff"/>

  <!-- Step 2 -->
  <g transform="translate(268, 100)" font-family="Segoe UI, -apple-system, sans-serif">
    <rect width="180" height="240" rx="10" fill="#141022" stroke="#c8ff00" stroke-width="1.5"/>
    <circle cx="90" cy="40" r="20" fill="#c8ff00" fill-opacity="0.2"/>
    <text x="82" y="47" fill="#c8ff00" font-size="18" font-weight="700">2</text>
    <text x="90" y="85" fill="#e8f7ff" font-size="15" font-weight="700" text-anchor="middle">Debate &amp; Align</text>
    <text x="90" y="115" fill="#c8ff00" font-size="12" text-anchor="middle">• Present dry-run</text>
    <text x="90" y="135" fill="#c8ff00" font-size="12" text-anchor="middle">• Ask preferences</text>
    <text x="90" y="155" fill="#c8ff00" font-size="12" text-anchor="middle">• Exclude sensitive</text>
    <text x="90" y="195" fill="#a0aec0" font-size="11" text-anchor="middle">User gives green light</text>
  </g>

  <!-- Arrow 2 -->
  <polygon points="456,216 464,220 456,224" fill="#c8ff00"/>

  <!-- Step 3 -->
  <g transform="translate(472, 100)" font-family="Segoe UI, -apple-system, sans-serif">
    <rect width="180" height="240" rx="10" fill="#141022" stroke="#ff8800" stroke-width="1.5"/>
    <circle cx="90" cy="40" r="20" fill="#ff8800" fill-opacity="0.2"/>
    <text x="82" y="47" fill="#ff8800" font-size="18" font-weight="700">3</text>
    <text x="90" y="85" fill="#e8f7ff" font-size="15" font-weight="700" text-anchor="middle">Manifest Snapshot</text>
    <text x="90" y="115" fill="#ffaa44" font-size="12" text-anchor="middle">• Backup if heavy</text>
    <text x="90" y="135" fill="#ffaa44" font-size="12" text-anchor="middle">• Write JSON log</text>
    <text x="90" y="155" fill="#ffaa44" font-size="12" text-anchor="middle">• Log source paths</text>
    <text x="90" y="195" fill="#a0aec0" font-size="11" text-anchor="middle">Undo transaction ready</text>
  </g>

  <!-- Arrow 3 -->
  <polygon points="660,216 668,220 660,224" fill="#ff8800"/>

  <!-- Step 4 -->
  <g transform="translate(676, 100)" font-family="Segoe UI, -apple-system, sans-serif">
    <rect width="180" height="240" rx="10" fill="#141022" stroke="#ff2bd6" stroke-width="1.5"/>
    <circle cx="90" cy="40" r="20" fill="#ff2bd6" fill-opacity="0.2"/>
    <text x="82" y="47" fill="#ff2bd6" font-size="18" font-weight="700">4</text>
    <text x="90" y="85" fill="#e8f7ff" font-size="15" font-weight="700" text-anchor="middle">Atomic Move</text>
    <text x="90" y="115" fill="#ff2bd6" font-size="12" text-anchor="middle">• Collision suffix (1)</text>
    <text x="90" y="135" fill="#ff2bd6" font-size="12" text-anchor="middle">• Byte verification</text>
    <text x="90" y="155" fill="#ff2bd6" font-size="12" text-anchor="middle">• Emojis &amp; brackets</text>
    <text x="90" y="195" fill="#a0aec0" font-size="11" text-anchor="middle">Clean atomic moves</text>
  </g>

  <!-- Arrow 4 -->
  <polygon points="864,216 872,220 864,224" fill="#ff2bd6"/>

  <!-- Step 5 -->
  <g transform="translate(880, 100)" font-family="Segoe UI, -apple-system, sans-serif">
    <rect width="180" height="240" rx="10" fill="#141022" stroke="#00ffff" stroke-width="1.5"/>
    <circle cx="90" cy="40" r="20" fill="#00ffff" fill-opacity="0.2"/>
    <text x="82" y="47" fill="#00ffff" font-size="18" font-weight="700">5</text>
    <text x="90" y="85" fill="#e8f7ff" font-size="15" font-weight="700" text-anchor="middle">Report &amp; Undo</text>
    <text x="90" y="115" fill="#00ffff" font-size="12" text-anchor="middle">• Adaptive Tree</text>
    <text x="90" y="135" fill="#00ffff" font-size="12" text-anchor="middle">• Disk telemetry</text>
    <text x="90" y="155" fill="#00ffff" font-size="12" text-anchor="middle">• Selective rollback</text>
    <text x="90" y="195" fill="#a0aec0" font-size="11" text-anchor="middle">Full or partial undo</text>
  </g>

  <rect x="40" y="375" width="1020" height="3" fill="url(#flowGrad)"/>
</svg>
