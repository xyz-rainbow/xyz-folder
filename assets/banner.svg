<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="xyz-folder banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0614"/>
      <stop offset="55%" stop-color="#12081f"/>
      <stop offset="100%" stop-color="#061018"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#c8ff00"/>
      <stop offset="100%" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="folderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff2bd6" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect x="0" y="316" width="1280" height="4" fill="url(#neon)"/>

  <!-- Brand Typography -->
  <text x="64" y="125" fill="#e8f7ff" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.5">xyz-folder</text>
  <text x="64" y="178" fill="#8ad4e8" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="20">Adaptive Directory &amp; Drive Organizer — Dynamic Emoji Taxonomy &amp; Zero Data Loss</text>
  <text x="64" y="215" fill="#a0aec0" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15">Pre-flight alignment debate • Full undo &amp; selective rollback • OS &amp; language auto-detection</text>

  <!-- CLI badge / Command pill -->
  <rect x="64" y="246" width="380" height="38" rx="8" fill="#141026" stroke="#00f0ff" stroke-width="1.5"/>
  <text x="80" y="271" fill="#00f0ff" font-family="Consolas, Monaco, monospace" font-size="15" font-weight="600">npx skills add xyz-rainbow/xyz-folder</text>

  <!-- Graphic Accents: Futuristic Folder Geometries -->
  <g transform="translate(1020, 60)">
    <!-- Back folder tab -->
    <path d="M 40 40 L 90 40 L 110 60 L 220 60 L 220 180 L 40 180 Z" fill="none" stroke="#ff2bd6" stroke-width="2" opacity="0.6"/>
    <!-- Front folder body -->
    <path d="M 20 70 L 200 70 L 180 190 L 0 190 Z" fill="#141026" stroke="#00f0ff" stroke-width="2.5"/>
    <!-- Inner document lines -->
    <line x1="45" y1="110" x2="155" y2="110" stroke="#c8ff00" stroke-width="2" stroke-linecap="round"/>
    <line x1="45" y1="135" x2="135" y2="135" stroke="#8ad4e8" stroke-width="2" stroke-linecap="round"/>
    <line x1="45" y1="160" x2="165" y2="160" stroke="#ff2bd6" stroke-width="2" stroke-linecap="round"/>
    <!-- Decorative neon orbit nodes -->
    <circle cx="210" cy="50" r="6" fill="#00f0ff"/>
    <circle cx="230" cy="120" r="4" fill="#c8ff00"/>
    <circle cx="-15" cy="130" r="5" fill="#ff2bd6"/>
  </g>
</svg>
